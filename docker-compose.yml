# Carzinomax Dev - full stack in one file: pgvector Postgres, FastAPI backend,
# React/Vite frontend served by nginx (which proxies /api to the backend, the
# same way the Vite dev server does).
#
#   cp backend/.env.example backend/.env   # set SECRET_KEY, ADMIN_*, LLM_*
#   docker compose up --build
#
#   Frontend  http://localhost:5173
#   API docs  http://localhost:8000/docs
#
# backend/.env supplies everything except ADMIN_DB_CONNECTION, which is set
# below to the `db` service. Ports and DB credentials can be overridden from
# the shell or a root .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# DB_PORT, BACKEND_PORT, FRONTEND_PORT.
#
# Needs Docker Compose v2.23+ (dockerfile_inline and configs.content).

name: carzinomax-dev

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carzinomax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carzinomax}
      POSTGRES_DB: ${POSTGRES_DB:-carzinomax}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      # Runs once, when the pgdata volume is first initialised.
      - source: db_init
        target: /docker-entrypoint-initdb.d/01-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.14-slim
        COPY --from=ghcr.io/astral-sh/uv:0.11 /uv /uvx /bin/
        ENV UV_COMPILE_BYTECODE=1 UV_LINK_MODE=copy UV_PYTHON_DOWNLOADS=never
        WORKDIR /app
        # Dependencies first so they are cached independently of app code.
        COPY pyproject.toml uv.lock ./
        RUN uv sync --frozen --no-dev
        # Explicit paths: the host .venv, .env, logs and IDE files stay out.
        COPY alembic.ini ./
        COPY migration ./migration
        COPY app ./app
        EXPOSE 8000
        # Tables are created only by Alembic; app startup does not create_all.
        # One APScheduler per process, so the server stays single-worker.
        CMD ["sh", "-c", "uv run --frozen alembic upgrade head && uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - ./backend/.env
    environment:
      ADMIN_DB_CONNECTION: postgresql://${POSTGRES_USER:-carzinomax}:${POSTGRES_PASSWORD:-carzinomax}@db:5432/${POSTGRES_DB:-carzinomax}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # loguru writes backend/logs/system and backend/logs/users here.
      - ./backend/logs:/app/logs
      # Chat attachments (app/core/uploads.py) land in backend/uploads/<user_id>/.
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm install --no-audit --no-fund
        # Explicit paths: the host node_modules and dist stay out.
        COPY index.html vite.config.js ./
        COPY public ./public
        COPY src ./src
        ARG VITE_API_BASE_URL=/api/v1
        RUN npm run build

        FROM nginx:1.28-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

configs:
  db_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

  nginx_conf:
    content: |
      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Same-origin API, mirrors the Vite dev proxy in frontend/vite.config.js.
        location /api/ {
          proxy_pass http://backend:8000;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_read_timeout 300s;   # LLM chat replies can take a while
          client_max_body_size 12m;  # chat attachments: UPLOAD_MAX_BYTES (10 MB) plus multipart overhead
        }

        # SPA fallback for react-router routes.
        location / {
          try_files $$uri $$uri/ /index.html;
        }
      }

volumes:
  pgdata:
