# Alembic configuration. The database URL is NOT set here - migration/env.py
# resolves it from app.core.config.settings (same .env the app uses).
# NOTE: keep this file ASCII-only; it is parsed with the OS locale encoding.
# Run commands from the backend/ directory, e.g.:
#   .venv\Scripts\alembic revision --autogenerate -m "add my_table"
#   .venv\Scripts\alembic upgrade head
# The app also runs `upgrade head` automatically on startup.

[alembic]
script_location = %(here)s/migration
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
